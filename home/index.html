<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Our New Home</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f3ec;
      --card: #fffdf9;
      --cell: #fffdf9;
      --cell-alt: #f9f5ee;
      --text: #2b2723;
      --muted: #7a7068;
      --faint: #b3a99d;
      --accent: #b5643c;
      --border: #e6ddd0;
      --c-deadline: #c2492f;
      --c-money: #2f7d5b;
      --c-milestone: #3b5ea8;
      --c-possession: #7a4fa3;
      --c-info: #8a8076;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1a17;
        --card: #25221e;
        --cell: #23201c;
        --cell-alt: #1f1d1a;
        --text: #f1ebe2;
        --muted: #a89e92;
        --faint: #6b625a;
        --accent: #e0915f;
        --border: #3a352f;
        --c-deadline: #e8735a;
        --c-money: #5cbf91;
        --c-milestone: #7d9ee6;
        --c-possession: #b28ad9;
        --c-info: #a39a90;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 "Inter", system-ui, sans-serif;
    }
    button { font: inherit; color: inherit; }
    .serif { font-family: "Fraunces", Georgia, serif; }

    .app {
      display: grid;
      grid-template-columns: 2fr 1fr;
      height: 100vh;
    }
    .pane { overflow-y: auto; min-width: 0; }
    .cal-pane { padding: 0 24px 40px; }
    .side-pane {
      border-left: 1px solid var(--border);
      background: var(--card);
      padding: 24px 20px 40px;
    }

    /* ---------- calendar ---------- */
    .cal-top {
      position: sticky; top: 0; z-index: 5;
      background: var(--bg);
      padding: 20px 0 8px;
    }
    .cal-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .cal-title h1 { font-size: 28px; font-weight: 600; margin: 0; }
    .cal-title .place { color: var(--muted); }
    .cal-title button {
      margin-left: auto;
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 4px 12px; cursor: pointer;
    }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 10px 0 12px; color: var(--muted); font-size: 12px; }
    .legend span::before {
      content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px;
      background: var(--c); margin-right: 6px; vertical-align: -1px;
    }
    .legend .dashed::before { background: none; border: 2px dashed var(--muted); width: 14px; height: 6px; border-radius: 0; }
    .dow { display: grid; grid-template-columns: repeat(7, 1fr); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
    .dow div { padding: 0 8px; }

    .weeks { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .week {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      border-top: 1px solid var(--border);
      position: relative;
    }
    .week:first-child { border-top: 0; }
    .day-bg { background: var(--cell); border-left: 1px solid var(--border); }
    .day-bg:nth-child(1) { border-left: 0; }
    .day-bg.alt { background: var(--cell-alt); }
    .day-bg.past { opacity: .55; }
    .day-bg.today { box-shadow: inset 0 0 0 2px var(--accent); }
    .day-head { padding: 6px 6px 4px; min-width: 0; z-index: 1; }
    .day-num { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .day-num b { font-weight: 600; color: var(--text); }
    .day-num .mon { font-family: "Fraunces", Georgia, serif; font-weight: 600; color: var(--accent); font-size: 13px; }
    .is-today .day-num b {
      background: var(--accent); color: #fff; border-radius: 999px; padding: 0 6px;
    }
    .is-past { opacity: .55; }
    .chip {
      display: block; width: 100%; text-align: left;
      margin-top: 3px; padding: 1px 6px;
      border: 0; border-radius: 4px;
      background: color-mix(in srgb, var(--c) 16%, transparent);
      color: var(--text);
      font-size: 11px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: pointer;
      border-left: 3px solid var(--c);
    }
    .chip.tentative { border-left-style: dashed; font-style: italic; }
    .chip.big { font-weight: 700; background: var(--c); color: #fff; }

    .bar {
      z-index: 1;
      margin: 2px 0;
      height: 16px;
      background: color-mix(in srgb, var(--c) 22%, transparent);
      border: 1.5px solid var(--c);
      border-radius: 999px;
      font-size: 10.5px; line-height: 13px; font-weight: 500;
      padding: 0 8px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: pointer; text-align: left;
      color: var(--text);
    }
    .bar.soft { border-style: dashed; background: transparent; }
    .bar.cont-l { border-left: 0; border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: -1px; }
    .bar.cont-r { border-right: 0; border-top-right-radius: 0; border-bottom-right-radius: 0; margin-right: -1px; }
    .bar:not(.cont-l) { margin-left: 4px; }
    .bar:not(.cont-r) { margin-right: 4px; }
    .chip:focus-visible, .bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .sel { box-shadow: 0 0 0 2px var(--accent); }

    /* ---------- sidebar ---------- */
    .today-date { color: var(--muted); font-size: 13px; }
    .countdown { display: flex; gap: 12px; margin: 10px 0 20px; }
    .count {
      flex: 1; border: 1px solid var(--border); border-radius: 12px; padding: 12px;
      background: var(--bg);
    }
    .count .n { font-family: "Fraunces", Georgia, serif; font-size: 34px; font-weight: 600; line-height: 1; }
    .count .l { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .count.urgent .n { color: var(--c-deadline); }

    .side h2 {
      font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted);
      margin: 24px 0 8px; font-weight: 600;
    }
    .item {
      display: block; width: 100%; text-align: left;
      background: none; border: 0; border-radius: 8px;
      padding: 8px 10px 8px 12px; margin: 0 0 4px;
      border-left: 3px solid var(--c);
      cursor: pointer;
    }
    .item:hover { background: var(--bg); }
    .item.tentative { border-left-style: dashed; }
    .item .t { font-weight: 600; }
    .item .m { color: var(--muted); font-size: 12px; }
    .item .rel { float: right; font-size: 12px; color: var(--muted); font-weight: 500; }
    .item .rel.soon { color: var(--c-deadline); font-weight: 600; }
    .progress { height: 4px; background: var(--border); border-radius: 4px; margin-top: 6px; overflow: hidden; }
    .progress div { height: 100%; background: var(--c); }
    .empty { color: var(--faint); font-style: italic; padding: 4px 0; }

    .detail {
      border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
      background: var(--bg); margin-bottom: 8px; position: relative;
      border-top: 4px solid var(--c);
    }
    .detail h3 { margin: 0 0 2px; font-size: 17px; }
    .detail ul { margin: 8px 0 0; padding-left: 18px; }
    .detail li { margin-bottom: 3px; }
    .detail .ref { color: var(--muted); font-size: 12px; margin-top: 8px; }
    .detail .warn { margin-top: 8px; font-size: 13px; color: var(--c-deadline); }
    .detail .x { position: absolute; top: 8px; right: 10px; background: none; border: 0; cursor: pointer; color: var(--muted); font-size: 18px; }

    .steps { list-style: none; padding: 0; margin: 0; }
    .steps li {
      position: relative; padding: 0 0 14px 26px; margin-left: 6px;
      border-left: 2px solid var(--border);
    }
    .steps li:last-child { border-left-color: transparent; padding-bottom: 0; }
    .steps li::before {
      content: ""; position: absolute; left: -8px; top: 3px;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--card); border: 2px solid var(--border);
    }
    .steps li.done::before { background: var(--c-money); border-color: var(--c-money); }
    .steps li.next::before { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 30%, var(--card)); }
    .steps li.done { color: var(--muted); }
    .steps .when { display: block; color: var(--muted); font-size: 12px; }
    .steps button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font-weight: 600; }

    .q { padding: 8px 0; border-top: 1px solid var(--border); font-size: 13px; }
    .q:first-of-type { border-top: 0; }
    details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
    .trig { padding: 8px 0; border-top: 1px solid var(--border); font-size: 13px; }
    .trig b { display: block; }
    .trig .lim { color: var(--accent); font-weight: 600; }

    .item .rel.done { color: var(--c-money); }
    .item .rel.overdue { color: var(--c-deadline); font-weight: 600; }
    .steps li.overdue::before { border-color: var(--c-deadline); }
    .fine { color: var(--faint); font-size: 12px; margin-top: 28px; }
    .side-actions { float: right; }
    .side-actions button { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 2px 10px; cursor: pointer; color: var(--muted); font-size: 12px; }

    /* ---------- lock screen ---------- */
    .lock {
      min-height: 100vh; display: grid; place-items: center; padding: 16px;
    }
    .lock form {
      width: 100%; max-width: 340px; text-align: center;
      background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 32px 24px;
    }
    .lock .icon { font-size: 40px; }
    .lock h1 { font-size: 24px; margin: 8px 0 20px; font-weight: 600; }
    .lock input[type=password] {
      width: 100%; padding: 10px 12px; font: inherit; font-size: 16px;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
    }
    .lock input[type=password]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .lock label { display: flex; gap: 8px; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; margin: 12px 0 16px; }
    .lock button {
      width: 100%; padding: 10px; border: 0; border-radius: 10px; cursor: pointer;
      background: var(--accent); color: #fff; font-weight: 600;
    }
    .lock button:disabled { opacity: .6; cursor: wait; }
    .lock .err { color: var(--c-deadline); font-size: 13px; min-height: 20px; margin-top: 10px; }
    [hidden] { display: none !important; }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; height: auto; }
      .pane { overflow: visible; }
      .cal-pane { padding: 0 16px 24px; }
      /* on a phone the status board matters most, so it comes first */
      .side-pane { order: -1; border-left: 0; border-bottom: 1px solid var(--border); padding: 24px 16px 32px; }
      .cal-top { position: static; }
      .chip { font-size: 10px; padding: 0 4px; }
      .bar { font-size: 9.5px; padding: 0 4px; }
      .day-head { padding: 4px 3px; }
    }
  </style>
</head>
<body>
  <div class="lock" id="lock">
    <form id="lockForm">
      <div class="icon">🏡</div>
      <h1 class="serif">Our new home</h1>
      <input type="password" id="pass" placeholder="Password" autocomplete="current-password" autofocus required>
      <label><input type="checkbox" id="remember" checked> Remember on this device</label>
      <button type="submit" id="unlockBtn">Unlock</button>
      <div class="err" id="lockErr" role="alert"></div>
    </form>
  </div>

  <div class="app" id="app" hidden>
    <main class="pane cal-pane" id="calPane">
      <div class="cal-top">
        <div class="cal-title">
          <h1 class="serif" id="title"></h1>
          <span class="place" id="place"></span>
          <button id="jumpToday" type="button">Today</button>
        </div>
        <div class="legend">
          <span style="--c: var(--c-deadline)">Deadline</span>
          <span style="--c: var(--c-money)">Money</span>
          <span style="--c: var(--c-milestone)">Milestone / financing</span>
          <span style="--c: var(--c-possession)">Possession</span>
          <span style="--c: var(--c-info)">Info</span>
          <span class="dashed">Uncertain / needs confirming</span>
        </div>
        <div class="dow"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
      </div>
      <div class="weeks" id="weeks"></div>
    </main>

    <aside class="pane side-pane side" id="side"></aside>
  </div>

  <script>
  (() => {
    // ---------- unlock ----------
    // Data lives encrypted in data.enc.json (made by encrypt.mjs). The key is
    // derived from the password here; "remember" stores the derived key, not
    // the password.
    const STORE = "home-key-v1";
    const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const b64e = b => btoa(String.fromCharCode(...new Uint8Array(b)));
    const store = {
      get() { try { return JSON.parse(localStorage.getItem(STORE)); } catch { return null; } },
      set(v) { try { localStorage.setItem(STORE, JSON.stringify(v)); } catch {} },
      clear() { try { localStorage.removeItem(STORE); } catch {} },
    };

    let blob;
    const loadBlob = async () => blob ||= await (await fetch("data.enc.json", { cache: "no-cache" })).json();

    const deriveKey = async (pass, b) => {
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64d(b.salt), iterations: b.iter, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    };
    const decrypt = async (key, b) => JSON.parse(new TextDecoder().decode(
      await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(b.iv) }, key, b64d(b.ct))));

    const show = H => {
      document.getElementById("lock").hidden = true;
      document.getElementById("app").hidden = false;
      render(H);
    };

    const form = document.getElementById("lockForm");
    const err = document.getElementById("lockErr");
    const btn = document.getElementById("unlockBtn");
    form.onsubmit = async ev => {
      ev.preventDefault();
      err.textContent = ""; btn.disabled = true; btn.textContent = "Unlocking…";
      try {
        const b = await loadBlob();
        const key = await deriveKey(document.getElementById("pass").value, b);
        const H = await decrypt(key, b);
        if (document.getElementById("remember").checked) {
          store.set({ salt: b.salt, key: b64e(await crypto.subtle.exportKey("raw", key)) });
        }
        show(H);
      } catch (e) {
        err.textContent = e instanceof SyntaxError || e.name === "TypeError" ? "Couldn't load the data." : "Wrong password.";
        btn.disabled = false; btn.textContent = "Unlock";
      }
    };

    // Try a remembered key first. If the data was re-encrypted with a new
    // salt or password, fall back to the lock screen.
    (async () => {
      const saved = store.get();
      if (!saved) return;
      try {
        const b = await loadBlob();
        if (saved.salt !== b.salt) throw new Error("stale");
        const key = await crypto.subtle.importKey("raw", b64d(saved.key), "AES-GCM", false, ["decrypt"]);
        show(await decrypt(key, b));
      } catch { store.clear(); }
    })();

    const lock = () => { store.clear(); location.reload(); };

  const render = H => {
    const DAY = 864e5;

    // ---------- date helpers (all local, date-only) ----------
    const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
    const key = dt => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
    const addDays = (dt, n) => new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() + n);
    const diff = (a, b) => Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / DAY);
    const fmt = (dt, opts) => dt.toLocaleDateString("en-US", opts);
    const fmtShort = dt => fmt(dt, { weekday: "short", month: "short", day: "numeric" });
    const rel = n => n === 0 ? "today" : n === 1 ? "tomorrow" : n === -1 ? "yesterday" : n > 0 ? `in ${n} days` : `${-n} days ago`;

    // ?today=2026-10-29 lets you preview any day
    const qp = new URLSearchParams(location.search).get("today");
    const now = new Date();
    const today = qp ? parse(qp) : new Date(now.getFullYear(), now.getMonth(), now.getDate());

    const events = H.events.map(e => ({ ...e, d: parse(e.date) })).sort((a, b) => a.d - b.d);
    const ranges = H.ranges.map(r => ({ ...r, s: parse(r.start), e: parse(r.end), soft: r.softFrom ? parse(r.softFrom) : null }));
    const byId = Object.fromEntries(events.map(e => [e.id, e]));
    const color = kind => `var(--c-${kind})`;
    const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };

    document.getElementById("title").textContent = H.title;
    document.getElementById("place").textContent = `${H.place} · closing ${fmt(parse(H.closing), { month: "short", day: "numeric" })}`;

    // ---------- calendar ----------
    const weeksEl = document.getElementById("weeks");
    let start = parse(H.calendarStart); start = addDays(start, -start.getDay());
    let end = parse(H.calendarEnd); end = addDays(end, 6 - end.getDay());
    let todayWeek = null;

    for (let ws = start; ws <= end; ws = addDays(ws, 7)) {
      const we = addDays(ws, 6);
      const week = el("div", "week");

      // bar segments for this week, possibly split into solid + soft parts
      const segs = [];
      for (const r of ranges) {
        if (r.e < ws || r.s > we) continue;
        const parts = r.soft ? [[r.s, addDays(r.soft, -1), false], [r.soft, r.e, true]] : [[r.s, r.e, false]];
        for (const [ps, pe, soft] of parts) {
          if (pe < ws || ps > we || pe < ps) continue;
          const s = ps < ws ? ws : ps, e = pe > we ? we : pe;
          segs.push({ r, s, e, soft, contL: s > r.s, contR: e < r.e, first: +s === +r.s || +s === +ws });
        }
      }
      const lanes = segs.length ? Math.max(...segs.map(x => x.r.lane)) + 1 : 0;
      week.style.gridTemplateRows = `minmax(68px, auto) repeat(${lanes}, 20px) 6px`;

      for (let i = 0; i < 7; i++) {
        const dt = addDays(ws, i);
        const isToday = diff(dt, today) === 0, isPast = dt < today;
        const bg = el("div", "day-bg" + (dt.getMonth() % 2 ? " alt" : "") + (isPast ? " past" : "") + (isToday ? " today" : ""));
        bg.style.gridColumn = i + 1; bg.style.gridRow = "1 / -1";
        week.appendChild(bg);

        const head = el("div", "day-head" + (isToday ? " is-today" : "") + (isPast ? " is-past" : ""));
        head.style.gridColumn = i + 1; head.style.gridRow = 1;
        const mon = dt.getDate() === 1 || +dt === +start ? `<span class="mon">${fmt(dt, { month: "short" })}</span>` : "";
        head.appendChild(el("div", "day-num", `${mon}<b>${dt.getDate()}</b>`));
        for (const e of events.filter(e => +e.d === +dt)) {
          const c = el("button", "chip" + (e.tentative ? " tentative" : "") + (e.id === "closing" ? " big" : ""));
          c.type = "button"; c.textContent = e.short || e.title; c.title = e.title;
          c.style.setProperty("--c", color(e.kind));
          c.dataset.event = e.id;
          head.appendChild(c);
        }
        week.appendChild(head);
        if (isToday) todayWeek = week;
      }

      for (const g of segs) {
        const b = el("button", "bar" + (g.soft ? " soft" : "") + (g.contL ? " cont-l" : "") + (g.contR ? " cont-r" : ""));
        b.type = "button";
        b.style.setProperty("--c", color(g.r.kind));
        b.style.gridColumn = `${g.s.getDay() + 1} / ${g.e.getDay() + 2}`;
        b.style.gridRow = g.r.lane + 2;
        b.textContent = g.first ? g.r.title + (g.soft ? " (uncertain)" : "") : "";
        b.title = `${g.r.title}: ${fmtShort(g.r.s)} → ${fmtShort(g.r.e)}`;
        b.dataset.event = g.r.event;
        week.appendChild(b);
      }
      weeksEl.appendChild(week);
    }

    const scrollToToday = () => todayWeek?.scrollIntoView({ block: "center", behavior: "smooth" });
    document.getElementById("jumpToday").onclick = scrollToToday;

    // ---------- sidebar ----------
    const side = document.getElementById("side");
    const closing = parse(H.closing);
    const upcoming = events.filter(e => e.d >= today);
    // Appointments aren't deadlines; keep the countdown on the next hard date.
    const nextDeadline = upcoming.find(e => !e.appointment && (e.kind === "deadline" || e.kind === "money"));

    // A past deadline only counts as handled once data.json marks it doneOn.
    const isOverdue = e => e.d < today && !e.doneOn && (e.kind === "deadline" || e.kind === "money");
    const itemHTML = (e, extra = "") => {
      const n = diff(today, e.d);
      const status = e.doneOn ? `<span class="rel done">✓ done</span>`
        : isOverdue(e) ? `<span class="rel overdue">not marked done</span>`
        : `<span class="rel${n >= 0 && n <= 7 ? " soon" : ""}">${rel(n)}</span>`;
      return `<button type="button" class="item${e.tentative ? " tentative" : ""}" data-event="${e.id}" style="--c:${color(e.kind)}">
        ${status}
        <div class="t">${e.title}</div>
        <div class="m">${fmtShort(e.d)}${e.time ? ` · ${e.time}` : ""}${e.tentative ? " · tentative" : ""}</div>${extra}</button>`;
    };
    const list = (arr, render, emptyMsg) => arr.length ? arr.map(render).join("") : `<div class="empty">${emptyMsg}</div>`;

    const todays = events.filter(e => diff(e.d, today) === 0);
    const active = ranges.filter(r => r.s <= today && today <= r.e);
    const soon = upcoming.filter(e => diff(today, e.d) > 0 && diff(today, e.d) <= 21);
    const later = upcoming.filter(e => diff(today, e.d) > 21);
    const passed = events.filter(e => e.d < today).reverse();
    const milestones = events.filter(e => e.milestone);
    const nextMilestone = milestones.find(e => e.d >= today);

    side.innerHTML = `
      <div class="side-actions"><button type="button" id="lockBtn">Lock</button></div>
      <div class="today-date">${fmt(today, { weekday: "long", month: "long", day: "numeric", year: "numeric" })}${qp ? " (preview)" : ""}</div>
      <div class="countdown">
        <div class="count"><div class="n">${Math.max(0, diff(today, closing))}</div><div class="l">days to closing</div></div>
        ${nextDeadline ? `<div class="count${diff(today, nextDeadline.d) <= 7 ? " urgent" : ""}"><div class="n">${diff(today, nextDeadline.d)}</div><div class="l">days to ${nextDeadline.short || nextDeadline.title}</div></div>` : ""}
      </div>

      <div id="detail"></div>

      <h2>Today</h2>
      ${list(todays, e => itemHTML(e), "Nothing due today.")}
      ${active.map(r => {
        const pct = Math.min(100, Math.round(100 * (diff(r.s, today) + 1) / (diff(r.s, r.e) + 1)));
        const left = diff(today, r.e);
        return `<button type="button" class="item" data-event="${r.event}" style="--c:${color(r.kind)}">
          <span class="rel${left <= 7 ? " soon" : ""}">${left === 0 ? "ends today" : `${left}d left`}</span>
          <div class="t">${r.title}</div>
          <div class="m">${fmtShort(r.s)} → ${fmtShort(r.e)}</div>
          <div class="progress"><div style="width:${pct}%"></div></div></button>`;
      }).join("")}

      <h2>Coming up · next 3 weeks</h2>
      ${list(soon, e => itemHTML(e), "Nothing in the next three weeks.")}

      <h2>Big milestones</h2>
      <ol class="steps">
        ${milestones.map(e => `<li class="${e.doneOn || (e.d < today && !isOverdue(e)) ? "done" : isOverdue(e) ? "overdue" : e === nextMilestone ? "next" : ""}">
          <button type="button" data-event="${e.id}">${e.title}</button>
          <span class="when">${fmtShort(e.d)} · ${rel(diff(today, e.d))}</span></li>`).join("")}
      </ol>

      <h2>Needs an answer from the attorney</h2>
      ${H.confirm.map(c => `<div class="q">${c.q}</div>`).join("")}

      <h2>Could start any time</h2>
      <details><summary>${H.triggered.length} event-triggered deadlines</summary>
        ${H.triggered.map(t => `<div class="trig"><b>${t.when}</b><span class="lim">${t.limit}</span> — ${t.action}</div>`).join("")}
      </details>

      <h2>Later</h2>
      ${list(later, e => itemHTML(e), "—")}

      <h2>Already passed</h2>
      ${list(passed, e => itemHTML(e), "Nothing yet.")}

      <p class="fine">Dates are calculated from the attorney-review letter and haven't been verified by the attorneys. Dashed items depend on an open question or the assumed ${fmt(closing, { month: "short", day: "numeric" })} closing.</p>
    `;

    // ---------- selection ----------
    const detail = document.getElementById("detail");
    const select = id => {
      const e = byId[id];
      document.querySelectorAll(".sel").forEach(n => n.classList.remove("sel"));
      if (!e) { detail.innerHTML = ""; return; }
      document.querySelectorAll(`.chip[data-event="${id}"]`).forEach(n => n.classList.add("sel"));
      const q = e.confirm && H.confirm.find(c => c.id === e.confirm);
      detail.innerHTML = `<div class="detail" style="--c:${color(e.kind)}">
        <button class="x" type="button" aria-label="Close">×</button>
        <h3 class="serif">${e.title}</h3>
        <div class="m" style="color:var(--muted)">${fmt(e.d, { weekday: "long", month: "long", day: "numeric" })}${e.time ? ` · ${e.time}` : ""} ·${rel(diff(today, e.d))}${e.tentative ? " · tentative" : ""}</div>
        <ul>${e.details.map(x => `<li>${x}</li>`).join("")}</ul>
        ${q ? `<div class="warn">⚠ ${q.q}</div>` : ""}
        ${e.ref ? `<div class="ref">Ref: ${e.ref}</div>` : ""}
      </div>`;
      detail.querySelector(".x").onclick = () => select(null);
      side.scrollTo?.({ top: 0, behavior: "smooth" });
      if (window.innerWidth <= 900) detail.scrollIntoView({ behavior: "smooth", block: "start" });
    };
    document.addEventListener("click", ev => {
      const t = ev.target.closest("[data-event]");
      if (t) select(t.dataset.event);
    });

    document.getElementById("lockBtn").onclick = lock;
    if (window.innerWidth > 900) requestAnimationFrame(() => todayWeek?.scrollIntoView({ block: "center" }));
  };
  })();
  </script>
</body>
</html>
